<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="pulseGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#0066b2" />
      <stop offset="65%" stop-color="#00b090" />
      <stop offset="100%" stop-color="#00cc88" />
    </linearGradient>
  </defs>

  <!-- Clean Box Canvas -->
  <rect width="500" height="500" fill="#ffffff" rx="28" stroke="#e2e8f0" stroke-width="4" />

  <g transform="translate(0, 10)">
    <!-- 1. DIGBOI COLLEGE (AUTONOMOUS) -->
    <text x="250" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#004b87" letter-spacing="1">
      Digboi College (Autonomous)
    </text>

    <!-- 2. ESTD. 1965 -->
    <text x="250" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#d97706" letter-spacing="2">
      Estd. 1965
    </text>

    <!-- 3. HORIZONTAL PULSE BELOW ESTD. 1965 -->
    <g id="pulse-wave">
      <!-- Background subtle guide line -->
      <line x1="30" y1="200" x2="470" y2="200" stroke="#f1f5f9" stroke-width="4" />
      <!-- Continuous Horizontal ECG Pulse Wave -->
      <path d="M 30,200 L 140,200 L 155,212 L 170,165 L 195,240 L 220,145 L 245,255 L 270,175 L 290,212 L 305,200 L 470,200" 
            fill="none" stroke="url(#pulseGreenGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 4. EDUPULSE -->
    <text x="250" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="-1">
      <tspan fill="#004b87">Edu</tspan><tspan fill="#00ab6c">Pulse</tspan>
    </text>

    <!-- 5. IGNITING LEARNING AND ENGAGEMENT -->
    <text x="250" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#004b87" letter-spacing="1.5">
      Igniting Learning and Engagement
    </text>
  </g>
</svg>
